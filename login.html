<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CyberToys</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <a class="marca" href="index.html"><img src="imagens/bumblebee.png" alt="Bumblebee" class="marca-icone"> CYBER<span>TOYS</span></a>
        <nav class="menu" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="anunciar.html">Anunciar toy</a>
            <a href="cadastro.html">Cadastro</a>
            <a class="ativo" href=="login.html">Login</a>
            <a href="admin.html">⚙ Admin</a>
        </nav>
        <div class="acoes-cabecalho">
            <button type="button" id="alternarIdioma" class="botao-tema" title="Alternar idioma" aria-label="Alternar idioma">🌐</button>
            <button type="button" id="alternarTema" class="botao-tema" title="Alternar tema" aria-label="Alternar tema">🌙</button>
        </div>
    </header>
    <main class="pagina-formulario">
        <section class="painel-formulario">
            <span class="etiqueta texto-azul">BEM-VINDO DE VOLTA</span>
            <h1>Entrar na CyberToys</h1>
            <p>Área demonstrativa de acesso do projeto acadêmico.</p>
            <form id="formLogin" class="formulario">
                <label>E-mail<input type="email" name="email" required placeholder="voce@email.com"></label>
                <label>Senha<input type="password" name="senha" required placeholder="Sua senha"></label>
                <button class="botao botao-azul largura-total" type="submit">Entrar</button>
            </form>
            <p class="mensagem-form" id="mensagemLogin" aria-live="polite"></p>
            <p class="texto-centro">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>.</p>
        </section>
    </main>
    <footer class="rodape rodape-simples"><p>© 2026 CyberToys — Projeto acadêmico.</p><a href="index.html">Voltar ao início</a></footer>
</body>
</html>
